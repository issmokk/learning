<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Library</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --accent-soft: #1f6feb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    line-height: 1.55;
    font-size: 15px;
    min-height: 100vh;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 64px 24px 80px;
  }
  h1 {
    font-size: 32px;
    margin: 0 0 8px 0;
    letter-spacing: -0.02em;
  }
  .subtitle {
    color: var(--muted);
    margin: 0 0 40px 0;
    font-size: 16px;
  }
  .section-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .curator {
    display: block;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 16px;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.15s, transform 0.15s;
  }
  .curator:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  .curator-name {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 4px 0;
  }
  .curator-bio {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 12px 0;
  }
  .curator-meta {
    color: var(--accent);
    font-size: 13px;
  }
  footer {
    margin-top: 64px;
    color: var(--muted);
    font-size: 12px;
    text-align: center;
  }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Learning Library</h1>
  <p class="subtitle">Curated knowledge collections from engineers I follow.</p>

  <div class="section-label">Curators</div>

  <a class="curator" href="feezan-khattak/">
    <p class="curator-name">Feezan Khattak</p>
    <p class="curator-bio">Backend Engineer focused on payments, distributed systems, and scalable APIs. Posts hand-drawn system design diagrams on LinkedIn.</p>
    <span class="curator-meta">25 concepts &middot; last 30 days &rarr;</span>
  </a>

  <footer>
    <a href="https://github.com/issmokk/learning">github.com/issmokk/learning</a>
  </footer>
</div>
</body>
</html>
